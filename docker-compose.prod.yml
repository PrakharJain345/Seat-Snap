services:
  postgres:
    image: postgres:16-alpine
    container_name: seatsnap-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seatsnap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seatsnap_secure_password_prod}
      POSTGRES_DB: ${POSTGRES_DB:-seatsnap}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seatsnap} -d ${POSTGRES_DB:-seatsnap}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seatsnap-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: seatsnap-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seatsnap-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: seatsnap-gateway-prod
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-seatsnap}:${POSTGRES_PASSWORD:-seatsnap_secure_password_prod}@postgres:5432/${POSTGRES_DB:-seatsnap}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      BOOKING_URL: http://booking-core:4001
      PAYMENT_URL: http://payment:4002
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seatsnap-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  booking-core:
    build:
      context: .
      dockerfile: services/booking-core/Dockerfile
    container_name: seatsnap-booking-core-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgres://${POSTGRES_USER:-seatsnap}:${POSTGRES_PASSWORD:-seatsnap_secure_password_prod}@postgres:5432/${POSTGRES_DB:-seatsnap}
      REDIS_URL: redis://redis:6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-300}
      SWEEPER_INTERVAL_SECONDS: ${SWEEPER_INTERVAL_SECONDS:-30}
      MAX_SEATS_PER_BOOKING: ${MAX_SEATS_PER_BOOKING:-6}
      PAYMENT_URL: http://payment:4002
      TICKET_SIGNING_SECRET: ${TICKET_SIGNING_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seatsnap-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: seatsnap-payment-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgres://${POSTGRES_USER:-seatsnap}:${POSTGRES_PASSWORD:-seatsnap_secure_password_prod}@postgres:5432/${POSTGRES_DB:-seatsnap}
      REDIS_URL: redis://redis:6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seatsnap-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: seatsnap-notification-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4003
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - seatsnap-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.prod
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    container_name: seatsnap-web-prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - gateway
    networks:
      - seatsnap-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  seatsnap-net:
    driver: bridge
