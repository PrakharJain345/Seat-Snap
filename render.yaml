# ==============================================================================
# SeatSnap — 100% Free-Tier Render Blueprint (No Credit Card / Payment Required)
# ==============================================================================

databases:
  - name: seatsnap-db
    databaseName: seatsnap
    user: seatsnap
    plan: free
    region: oregon

services:
  # ─── SeatSnap Unified Microservices Cluster (100% Free Web Service) ─────────
  # Runs Gateway, Booking Core, Payment, and Notification Worker seamlessly
  - type: web
    name: seatsnap-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start:all
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: seatsnap-db
          property: connectionString
      - key: REDIS_URL
        sync: false
        # Paste your free Redis URL from Upstash.com here
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: TICKET_SIGNING_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: HOLD_TTL_SECONDS
        value: "300"
      - key: SWEEPER_INTERVAL_SECONDS
        value: "30"
      - key: MAX_SEATS_PER_BOOKING
        value: "6"
      - key: CORS_ORIGIN
        value: "*"
